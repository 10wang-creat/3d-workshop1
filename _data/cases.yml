# 客戶名稱請匿名（例如「竹科某光學廠」）。有數字的成果最有說服力，但只寫確實量過的數字。
#
# - title: 案例名稱
#   industry: 產業或客戶類型（匿名）
#   image: 檔名.jpg            # 放在 assets/images/，沒有照片就整行刪掉
#   need: 客戶原本遇到的問題
#   design: 我們的設計做法
#   material: 使用材質與原因
#   result: 交件後的改變
#   metrics:                   # 選填：確實量過的數字
#     - 對位時間 30 秒 → 5 秒

- title: 產品掃描檢驗載體
  image: inspection-carrier.jpg
  need: 產品要進行掃描檢驗，每一件都必須固定在同一個位置，否則檢驗結果無法互相比較。
  design: 依產品外型設計對應的精密凹槽，產品放上去就定位，不需要另外對位或調整。
  material: 高精度樹脂，細節與尺寸表現適合精密定位用途。
  result: 擺放位置一致，檢驗流程不再依賴個人手感。
