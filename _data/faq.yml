# 常見問題 — 顯示在「價格與常見問題」頁（pricing.html），同時輸出 FAQ 結構化資料給搜尋引擎
# 欄位：q（問題）/ a（回答，純文字）/ link、link_text（選填，回答後面的延伸連結）

- q: 沒有 3D 檔可以委託嗎？
  a: 可以。我們提供建模設計服務，用照片、草圖、實體零件，甚至口頭描述都能開始，我們會先幫你把需求釐清。

- q: 有現成檔案的話，接受哪些格式？
  a: 支援 STL、OBJ、3MF。透過 LINE 或 Email 傳檔案過來就能報價。

- q: 最少要做幾個？
  a: 一個也能做，沒有最低數量限制。

- q: 多久可以交件？
  a: 有現成檔案的列印件，一般 24 到 72 小時可以交付。需要設計建模、數量較多或結構複雜的案子，會在報價時一併告知預估時程。急件請先說明。

- q: 可以只列印，或只做設計嗎？
  a: 可以。有現成檔案可以只委託列印；只需要 3D 建模或逆向建模的需求，也歡迎提出討論。

- q: 設計可以修改嗎？
  a: 建模完成後會先提供預覽給你確認，確認之後才開始列印。設計階段有需要調整的地方都可以提出。

- q: 不知道該選什麼材質怎麼辦？
  a: 告訴我們使用環境就可以，例如室內或戶外、會不會碰水、是否受力、溫度高不高，由我們建議合適的材質。
  link: /blog/2025/01/15/3d-printing-material-comparison.html
  link_text: 3D列印材料怎麼選

- q: 戶外或車內使用的東西可以做嗎？
  a: 可以，但材質要選對。車內與日曬環境溫度高，PLA 容易變形，我們會建議 ASA 或 ABS 這類耐熱耐候的材質。
  link: /blog/2026/07/29/special-purpose-materials.html
  link_text: 特殊用途的材料怎麼選

- q: 可以做會接觸食物的東西嗎？
  a: 一般 FDM 列印件表面有層紋，不容易清潔乾淨，不建議直接接觸食物。有這類需求請先告訴我們用途，我們會說明可行的做法與限制。
  link: /blog/2026/07/29/special-purpose-materials.html
  link_text: 食品接觸、戶外、高溫的材料選擇

- q: 產品還沒上市，可以保密嗎？
  a: 可以。涉及產品機密的案子，我們配合保密需求。
