title: 3D創想工坊
description: 專業3D列印服務
email: sstarfly@gmail.com
line_id: spg
# LINE 加好友連結（取自 LINE 個人 QR Code，不受「允許利用ID加入好友」設定影響）
line_url: "https://line.me/ti/p/ymMSjrR3vz"
# 蝦皮賣場網址：填入後，網站會顯示「在蝦皮購買」按鈕；留空則不顯示
shopee_url: "https://shopee.tw/10wang"
baseurl: "/3d-workshop1"
url: "https://10wang-creat.github.io"
# 正式網址：canonical、og:url、結構化資料一律指向這裡（GitHub Pages 與 Vercel 兩邊都用）
canonical_base: "https://www.3dcreativeworkshop.com"

# Blog settings
permalink: /blog/:year/:month/:day/:title.html

# 排程發布設定
timezone: Asia/Taipei   # 文章日期以台灣時間判斷
future: false           # 未來日期的文章先隱藏，到日子才出現

# Plugins
plugins:
  - jekyll-sitemap

# 不要複製到輸出的檔案
exclude:
  - Gemfile
  - Gemfile.lock
  - vercel.json
  - README.md
  - node_modules
  - .github
  - _originals
